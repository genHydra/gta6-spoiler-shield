<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 300px; margin: 0; padding: 16px; font: 13px/1.4 system-ui, "Segoe UI", sans-serif; background: #120c1c; color: #f5f3ff; }
  h1 { font-size: 15px; margin: 0 0 2px; }
  .sub { color: #a78bfa; font-size: 11px; margin-bottom: 14px; }
  .row { display: flex; align-items: center; justify-content: space-between; margin: 10px 0; }
  label { font-weight: 600; }
  select, textarea { width: 100%; box-sizing: border-box; background: #1f1630; color: #f5f3ff; border: 1px solid #3b2a5a; border-radius: 8px; padding: 6px 8px; font: inherit; }
  textarea { height: 150px; resize: vertical; font-size: 12px; margin-top: 6px; }
  .switch { position: relative; width: 40px; height: 22px; }
  .switch input { display: none; }
  .slider { position: absolute; inset: 0; background: #3b2a5a; border-radius: 22px; cursor: pointer; transition: .15s; }
  .slider:before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; }
  input:checked + .slider { background: #ec4899; }
  input:checked + .slider:before { transform: translateX(18px); }
  .hint { color: #8b7aa8; font-size: 11px; margin-top: 4px; }
  .btns { display: flex; gap: 8px; margin-top: 10px; }
  button { flex: 1; border: 0; border-radius: 8px; padding: 8px; font: 600 12px system-ui, sans-serif; cursor: pointer; }
  #save { background: #ec4899; color: #fff; }
  #reset { background: #2a1f3d; color: #c4b5fd; }
  #status { height: 14px; font-size: 11px; color: #86efac; margin-top: 6px; text-align: center; }
</style>
</head>
<body>
  <h1>GTA 6 Spoiler Shield</h1>
  <div class="sub">YouTube · Reddit · X · Twitch · Discord · Instagram</div>

  <div class="row">
    <label for="enabled">Blocking on</label>
    <label class="switch"><input type="checkbox" id="enabled"><span class="slider"></span></label>
  </div>

  <div class="row" style="display:block">
    <label for="mode">When something matches</label>
    <select id="mode" style="margin-top:6px">
      <option value="placeholder">Collapse it, with a "Show anyway" bar</option>
      <option value="remove">Remove it completely</option>
    </select>
  </div>

  <div style="margin-top:12px">
    <label for="keywords">Blocked words (one per line)</label>
    <textarea id="keywords" spellcheck="false"></textarea>
    <div class="hint">Spacing/dashes don't matter: "gta 6" also catches GTA6, GTA-6, #gta6.</div>
  </div>

  <div class="btns">
    <button id="reset">Reset list</button>
    <button id="save">Save</button>
  </div>
  <div id="status"></div>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
